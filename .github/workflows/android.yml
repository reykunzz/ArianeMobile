name: Android arm64 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, android-port ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (including upstream source references)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Report source integration status
        shell: bash
        run: |
          test -f third_party/ariane-upstream/README.md
          test -f third_party/librw/premake5.lua
          echo "Ariane upstream and librw submodules are present."
          echo "The Android CMake target currently builds the mobile adapter/bootstrap; desktop Premake targets are not compiled for Android."

      - name: Build debug APK (arm64-v8a)
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ariane-mobile-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
